<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO — ao publicar, troque https://aura.app pelo domínio real -->
    <title>Aura — sua jornada de transformação pessoal</title>
    <meta
      name="description"
      content="Organize metas, acompanhe leituras e veja sua evolução num só lugar. A jornada entre a mulher que você é hoje e a que decidiu se tornar."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://aura.app/" />

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aura" />
    <meta property="og:title" content="Aura — sua jornada de transformação pessoal" />
    <meta
      property="og:description"
      content="Metas, leituras e reflexões num só lugar. Comece hoje a se tornar quem você decidiu ser."
    />
    <meta property="og:url" content="https://aura.app/" />
    <meta property="og:image" content="https://aura.app/og.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aura — sua jornada de transformação pessoal" />
    <meta
      name="twitter:description"
      content="Metas, leituras e reflexões num só lugar. Comece hoje a se tornar quem você decidiu ser."
    />
    <meta name="twitter:image" content="https://aura.app/og.png" />

    <!-- Dados estruturados -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Aura",
        "description": "SaaS de transformação pessoal — metas, leituras e reflexões num só lugar.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "url": "https://aura.app/",
        "offers": {
          "@type": "Offer",
          "price": "14.90",
          "priceCurrency": "BRL",
          "description": "Preço de fundadora — as 10 primeiras pessoas"
        },
        "creator": { "@type": "Person", "name": "Layra Lima" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
