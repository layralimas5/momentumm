<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem isso o env(safe-area-inset-*) volta zero e a
         barra inferior fica embaixo do indicador de gestos do aparelho. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0B" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta
      name="description"
      content="O Momentumm transforma objetivos em ações diárias, mede se o seu ritmo está de pé e ajusta o plano quando ele deixa de funcionar. Um sistema de progresso pessoal, não mais um app de hábitos."
    />
    <link rel="canonical" href="https://www.momentumm.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Momentumm" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://www.momentumm.com.br/" />
    <meta property="og:title" content="Momentumm: do objetivo à ação de hoje" />
    <meta
      property="og:description"
      content="Objetivo vira plano. Plano vira o que você faz hoje. Momentumm, dia adaptável, modo retomada e IA que conhece o seu plano."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Momentumm: do objetivo à ação de hoje" />
    <meta
      name="twitter:description"
      content="Objetivo vira plano. Plano vira o que você faz hoje. Um sistema de progresso pessoal, não mais um app de hábitos."
    />
    <meta name="twitter:image" content="/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Momentumm",
        "applicationCategory": "LifestyleApplication",

        "url": "https://www.momentumm.com.br/",
        "description": "Sistema de progresso pessoal: transforma objetivos em ações diárias, mede o ritmo com o Momentumm e ajusta o plano quando ele deixa de funcionar.",

          { "@type": "Offer", "name": "PRO anual", "price": "179.90", "priceCurrency": "BRL" }
        ]
      }

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
