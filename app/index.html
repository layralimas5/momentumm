<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem isso o env(safe-area-inset-*) volta zero e a
         barra inferior fica embaixo do indicador de gestos do aparelho. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0B" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Instalável (start_url=/app): é o que faz o iPhone aceitar notificação
         e o que abre o app direto, sem passar pela landing. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Momentumm" />

    <title>Momentumm: pare de recomeçar toda segunda-feira</title>
    <meta
      name="description"
      content="O Momentumm transforma sua meta em um plano possível, mostra o que realmente importa hoje e ajuda você a continuar quando a rotina sai do eixo."
    />
    <link rel="canonical" href="https://www.momentumm.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Momentumm" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://www.momentumm.com.br/" />
    <meta property="og:title" content="Momentumm: pare de recomeçar toda segunda-feira" />
    <meta
      property="og:description"
      content="Objetivo vira plano. Plano vira o que você faz hoje. Momentumm, dia adaptável, modo retomada e IA que conhece o seu plano."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Momentumm: pare de recomeçar toda segunda-feira" />
    <meta
      name="twitter:description"
      content="Objetivo vira plano. Plano vira ação. Ação vira progresso. Continue o que você começou."
    />
    <meta name="twitter:image" content="/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Momentumm",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "url": "https://www.momentumm.com.br/",
        "description": "Transforma sua meta em um plano possível, mostra o próximo passo de hoje e ajuda a continuar quando a rotina sai do eixo.",
        "inLanguage": "pt-BR",
        "offers": [
          { "@type": "Offer", "name": "Grátis", "price": "0", "priceCurrency": "BRL" },
          { "@type": "Offer", "name": "PRO mensal", "price": "39.90", "priceCurrency": "BRL" },
          { "@type": "Offer", "name": "PRO anual", "price": "129.90", "priceCurrency": "BRL" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
