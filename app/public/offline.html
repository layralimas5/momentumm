<!doctype html>
<!--
  A única página que o service worker guarda.

  Ela existe pra dois motivos: o aparelho sem rede continua abrindo o app com
  cara de app (e não com o dinossauro do navegador), e o Chrome exige uma
  resposta offline pra oferecer a instalação de verdade. Não tem script, não
  tem dado, não envelhece.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>Momentumm — sem conexão</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0a0a0b;
        --ink: #f4f4f5;
        --ink-muted: #a1a1aa;
        --line: #27272a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 24px 0 0;
        font-size: 1.25rem;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      p {
        margin: 10px 0 0;
        color: var(--ink-muted);
        font-size: 0.95rem;
        line-height: 1.55;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 24px;
        padding: 0 22px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #8b5cf6;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/simbolo.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>
        O Momentumm precisa de internet pra carregar o seu dia. Assim que a rede voltar, é só
        tentar de novo: nada do que você registrou se perdeu.
      </p>
      <a href="/app">Tentar de novo</a>
    </main>
  </body>
</html>
