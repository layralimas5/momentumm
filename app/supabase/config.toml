# Momentumm — configuração do projeto Supabase.
#
# O que interessa aqui é [auth] e [auth.rate_limit]: o freio do navegador
# (`domain/auth/auth-throttle`) impede o formulário de virar ferramenta de
# teste de senha, mas quem chama a API direto pula o navegador. Estes são os
# tetos do servidor. Aplicar com `supabase config push` (ou conferir em
# Authentication > Rate Limits no painel: os valores devem bater).

project_id = "hsgjlxetdopomeibdbho"

[auth]
site_url = "https://www.momentumm.com.br"
# Sem isso o link de recuperação/confirmação ignora o `redirectTo` do app e cai
# no site_url, que em dev nem tem a rota /nova-senha.
additional_redirect_urls = ["https://momentumm.com.br/**", "https://www.momentumm.com.br/**", "https://momentumm-354.netlify.app/**", "http://localhost:5176/**", "http://localhost:5173/**"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
# O mesmo critério de `domain/auth/password`: letras e números pelo menos.
password_requirements = "letters_digits"
# Sessão longa é conveniência; o refresh rotativo fecha o token vazado.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Reenvio de confirmação: um a cada minuto por endereço.
max_frequency = "1m"

# SMTP próprio. Sem isso o e-mail sai como "Supabase Auth" pelo servidor
# compartilhado, que existe só pra desenvolvimento: tem teto de 2 e-mails por
# hora e nenhuma garantia de entrega. Com o SMTP abaixo o remetente é o
# Momentumm e o teto passa a ser o do Gmail (500 envios por dia).
#
# A senha NÃO é a senha da conta Google: é uma senha de app de 16 caracteres,
# gerada em myaccount.google.com/apppasswords com a verificação em duas etapas
# ligada. Ela mora em `SUPABASE_AUTH_SMTP_PASS`, nunca no repositório.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "momentumm.suport@gmail.com"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
# O Gmail reescreve o remetente pro endereço autenticado: o nome é nosso, o
# endereço é obrigatoriamente esse.
admin_email = "momentumm.suport@gmail.com"
sender_name = "Momentumm"

# Os modelos em português. O padrão do Supabase é em inglês e diz "Supabase"
# no corpo, o que quebra a confiança logo no primeiro e-mail que a pessoa
# recebe do produto.
[auth.email.template.confirmation]
subject = "Confirma teu e-mail no Momentumm"
content_path = "./supabase/templates/confirmacao.html"

[auth.email.template.recovery]
subject = "Criar uma senha nova no Momentumm"
content_path = "./supabase/templates/recuperacao.html"

[auth.email.template.email_change]
subject = "Confirma o e-mail novo da tua conta"
content_path = "./supabase/templates/troca-de-email.html"

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
# E-mails (confirmação, recuperação, magic link) por hora, no projeto inteiro.
email_sent = 30
# Cadastros e logins por 5 minutos, por IP.
sign_in_sign_ups = 30
# Verificações de OTP/token por 5 minutos, por IP.
token_verifications = 30
# Refresh de sessão por 5 minutos, por IP.
token_refresh = 150
anonymous_users = 1
sms_sent = 1

# O webhook é chamado pelo Asaas, não por uma pessoa: sem JWT. A autenticação
# é o header `asaas-access-token`, conferido dentro da função.
[functions.asaas-webhook]
verify_jwt = false

[functions.push-reminders]
verify_jwt = false
