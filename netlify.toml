# Momentumm — deploy do front no Netlify.
#
# O app é uma SPA em `app/`: toda rota (`/app/objetivos`, `/admin`,
# `/app/assinatura?assinatura=sucesso`) precisa cair no `index.html`, senão
# recarregar a página dá 404. As variáveis `VITE_SUPABASE_URL` e
# `VITE_SUPABASE_ANON_KEY` ficam no painel do Netlify (Site configuration >
# Environment variables), nunca aqui.

[build]
  base    = "app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Assets com hash no nome podem ficar em cache pra sempre; o index não.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "DENY"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(self), microphone=(self), geolocation=()"
